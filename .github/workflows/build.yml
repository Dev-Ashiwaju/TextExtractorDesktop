name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Tesseract (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr libegl1 libxkbcommon0 libdbus-1-3 fonts-dejavu-core
      - name: Install Tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract
      - name: Install Tesseract (Windows)
        if: runner.os == 'Windows'
        run: choco install tesseract --no-progress -y
      - run: python -m pip install -e ".[rapidocr,dev]"
      - run: python -m pytest -q
        env: { QT_QPA_PLATFORM: offscreen }
      - run: python scripts/make_icons.py
      - run: pyinstaller packaging/textextractor.spec --noconfirm --clean
      - name: Smoke-test the frozen app
        shell: bash
        run: |
          BIN="dist/TextExtractor/TextExtractor"; [ -d "dist/Text Extractor.app" ] && BIN="dist/Text Extractor.app/Contents/MacOS/TextExtractor"
          QT_QPA_PLATFORM=offscreen "$BIN" --selftest
      - uses: actions/upload-artifact@v4
        with: { name: "TextExtractor-${{ matrix.os }}", path: "dist/" }
