[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textextractor"
version = "1.0.0"
description = "Offline image-to-text desktop app (screenshots, photos, scans)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.6", "Pillow>=10.0"]

[project.optional-dependencies]
rapidocr = ["rapidocr-onnxruntime>=1.3"]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
textextractor = "textextractor.app:main"

[project.gui-scripts]
textextractor-gui = "textextractor.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
textextractor = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["ocr: runs a real OCR engine (skipped if the engine is not installed)"]
